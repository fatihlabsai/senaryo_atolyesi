name: Uygulamayı derle ve yayınla
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Windows kurulum (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never
      - name: Mac kurulum (.dmg)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish never
      - name: Test dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: senaryo-atolyesi-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: senaryo-atolyesi-*
          path: dist-all
          merge-multiple: true
      - name: Sürüm yayınla ve latest.json güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          EXE="dist-all/senaryo-atolyesi-setup-${VERSION}.exe"
          if [ ! -f "$EXE" ]; then echo "Beklenen kurulum dosyası yok: $EXE"; ls -la dist-all; exit 1; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Senaryo Atölyesi ${VERSION}" --notes "Sürüm ${VERSION}"
          gh release upload "$TAG" dist-all/*.exe $(ls dist-all/*.dmg 2>/dev/null) --clobber
          URL="https://github.com/fatihlabsai/senaryo_atolyesi/releases/download/${TAG}/senaryo-atolyesi-setup-${VERSION}.exe"
          node -e 'const fs=require("fs");fs.writeFileSync("latest.json",JSON.stringify({version:process.argv[1],url:process.argv[2],notes:"Sürüm "+process.argv[1]},null,2)+"\n")' "$VERSION" "$URL"
          git config user.name "fatihlabsai"
          git config user.email "fatihlabsai@users.noreply.github.com"
          git add latest.json
          git commit -m "Sürüm ${VERSION} için latest.json [skip ci]" || echo "latest.json değişmedi"
          git push origin HEAD:main
